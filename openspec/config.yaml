schema: spec-driven

context: |
  Language: es
  All artifacts must be written in es.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  ## Proyecto: RUNCOACH
  Plataforma web de gestión de entrenamiento de running que conecta a
  entrenadores (coach) con sus atletas, bajo supervisión de un administrador
  (admin). Resuelve tres necesidades: planificación (plantillas -> planes
  semanales), ejecución y registro (calendario del atleta, resultados,
  evidencia fotográfica) y seguimiento/comunicación (métricas, feedback
  bidireccional, notificaciones).

  ## Stack técnico
  - PHP puro (sin framework, sin autoloader, sin Composer). Cada página de
    nivel superior (`*.php` en la raíz) es a la vez ruta y vista: mezcla
    lógica de request (GET/POST) con HTML embebido.
  - MySQL vía PDO, siempre con sentencias preparadas
    (`includes/db.php` -> `Database::getInstance()`, singleton PDO).
  - Autenticación 100% por sesión PHP nativa (`includes/auth.php` ->
    `Auth::init/check/user/login/logout/requireRole/requireRoleLike`). Sin
    tokens, sin OAuth, sin expiración configurable.
  - Modelos en `models/*.php` (User, Team, Workout, Notification), clases
    estáticas sin ORM, cada método arma su propio SQL.
  - Envío de correo con `includes/Mailer.php` vía `mail()` nativo de PHP.
  - Fuente de verdad técnica complementaria: `openapi.yaml` (contrato HTTP
    exacto de cada página) y `LINEA_BASE_SISTEMA.md` (propósito, diccionario
    de datos, flujos críticos y reglas de oro). OpenSpec documenta el "qué
    debe pasar" en Requirement/Scenario; openapi.yaml documenta el contrato
    HTTP exacto. No se duplican, se referencian entre sí.

  ## Convenciones a seguir en cualquier cambio
  - Toda query a la base de datos usa PDO prepared statements — nunca
    concatenar valores de usuario en el SQL.
  - Cualquier página protegida llama `Auth::requireRole($rol)` o
    `Auth::requireRoleLike([...])` al inicio, antes de cualquier otra lógica.
  - Los formularios POST usan el patrón `action=<nombre_accion>` dentro del
    mismo archivo PHP (no hay rutas RESTful ni controladores separados).
  - No introducir código sin al menos un caller real en el mismo cambio
    (ver la auditoría de código muerto que motivó esta línea base).

