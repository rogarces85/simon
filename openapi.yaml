openapi: 3.1.0
info:
  title: RUNCOACH API
  version: "2.0.0"
  description: >
    Especificación generada a partir de la "Verdad Actual" del sistema RUNCOACH
    (plataforma de gestión de entrenamiento entre entrenadores y atletas),
    extraída estrictamente del código PHP en producción. RUNCOACH no expone una
    API JSON tradicional: cada ruta es una página PHP que combina renderizado de
    HTML (GET) con procesamiento de formularios (POST, `application/x-www-form-urlencoded`
    o `multipart/form-data` cuando hay carga de archivos). Las acciones POST que
    tienen éxito responden con una redirección HTTP 302 (`header('Location: ...')`),
    replicando el patrón Post/Redirect/Get. No existen tokens ni API keys: la
    autenticación es 100% por sesión nativa de PHP.
    Quedan excluidos de esta especificación los métodos identificados como código
    muerto en la auditoría previa (`Team::find`, `Workout::getByCoach`,
    `Workout::markAsReceived`, `Workout::getPlanStatsByCoach`), por no formar
    parte de ningún flujo ejecutable hoy.
  contact:
    name: RUNCOACH
servers:
  - url: "http://{host}/SIMON"
    description: Instancia RUNCOACH (host configurado vía config/config.php -> BASE_URL)
    variables:
      host:
        default: localhost

security:
  - sessionAuth: []

tags:
  - name: Auth
    description: Inicio/cierre de sesión. Sesión PHP nativa (Auth::login/logout/check).
  - name: Dashboard
    description: Paneles de entrada según rol.
  - name: Admin
    description: Gestión global del sistema (rol admin).
  - name: Atletas
    description: CRUD de atletas por parte del coach.
  - name: Planes
    description: Generación de planes semanales y plantillas de entrenamiento.
  - name: Entrenamientos
    description: Revisión de entrenamientos completados y feedback del coach.
  - name: Mi Plan
    description: Calendario mensual y registro de resultados del atleta.
  - name: Métricas
    description: Estadísticas y progreso de atletas.
  - name: Notificaciones
    description: Mensajería in-app entre coach y atletas.
  - name: Perfil
    description: Datos de cuenta del usuario autenticado.
  - name: Team
    description: Identidad visual del equipo del coach.

paths:
  /login.php:
    get:
      tags: [Auth]
      summary: Formulario de inicio de sesión
      description: >
        Si ya existe una sesión activa (Auth::check), redirige a `dashboard.php`.
        En caso contrario, renderiza el formulario de login.
      security: []
      responses:
        "200":
          description: Formulario de login renderizado.
          content:
            text/html: { schema: { type: string } }
        "302":
          description: Sesión ya activa — redirección a dashboard.php.
          $ref: "#/components/responses/RedirectDashboard"
    post:
      tags: [Auth]
      summary: Autenticar usuario
      description: >
        Valida credenciales contra la tabla `users` con `password_verify`.
        Si son correctas, crea la sesión (`$_SESSION['user_id'|'role'|'name']`)
        y redirige a `dashboard.php`. Si no, re-renderiza el formulario con
        el mensaje de error "Credenciales inválidas".
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [csrf_token, username, password]
              properties:
                csrf_token: { $ref: "#/components/schemas/CsrfToken" }
                username: { type: string, description: "Coincide con users.username (email)", example: "coach@runcoach.com" }
                password: { type: string, format: password, example: "coach123" }
      responses:
        "302":
          description: Login exitoso.
          $ref: "#/components/responses/RedirectDashboard"
        "200":
          description: >
            Credenciales inválidas, o bloqueo temporal tras 5 intentos
            fallidos en 15 minutos para el mismo username — formulario
            re-renderizado con el error correspondiente.
          content:
            text/html:
              schema: { type: string }
              examples:
                credenciales_invalidas: { value: "Credenciales inválidas" }
                bloqueado: { value: "Demasiados intentos fallidos. Intenta nuevamente en unos minutos." }

  /logout.php:
    get:
      tags: [Auth]
      summary: Cerrar sesión
      description: Destruye la sesión (`session_destroy`) y redirige a `login.php`.
      responses:
        "302":
          description: Redirección a login.php.
          headers:
            Location: { schema: { type: string, example: "login.php" } }

  /index.php:
    get:
      tags: [Dashboard]
      summary: Punto de entrada / router simple
      description: Redirige a `dashboard.php` si hay sesión activa, o a `login.php` si no.
      responses:
        "302":
          description: Redirección según estado de sesión.
          headers:
            Location: { schema: { type: string, example: "dashboard.php" } }

  /dashboard.php:
    get:
      tags: [Dashboard]
      summary: Panel principal (según rol)
      description: >
        Requiere sesión activa. Si `role=admin`, redirige a `admin_dashboard.php`.
        Si `role=athlete`, redirige a `mi_plan.php`. Si `role=coach`, renderiza el
        panel con conteo de atletas, datos del team y hasta 5 notificaciones
        no leídas recientes (`Notification::getUnread`).
      responses:
        "200":
          description: Panel del coach renderizado.
          content:
            text/html: { schema: { type: string } }
        "302":
          description: Redirección por rol (admin/athlete) o por falta de sesión.
          $ref: "#/components/responses/RedirectByRole"

  /admin_dashboard.php:
    get:
      tags: [Admin]
      summary: Listado de entrenadores registrados
      description: Requiere `role=admin` (`Auth::requireRole('admin')`). Lista todos los coaches y su team asociado.
      responses:
        "200":
          description: Tabla de entrenadores.
          content:
            text/html: { schema: { type: string } }
        "302":
          description: Sin sesión activa o rol distinto de admin — redirección a login.php.
          $ref: "#/components/responses/RedirectLogin"

  /crear_entrenador.php:
    get:
      tags: [Admin]
      summary: Formulario de alta de entrenador
      description: Requiere `role=admin`.
      responses:
        "200":
          description: Formulario de alta de entrenador renderizado.
          content: { text/html: { schema: { type: string } } }
    post:
      tags: [Admin]
      summary: Crear un nuevo entrenador
      description: >
        Requiere `role=admin`. Valida que los 3 campos estén presentes y que el
        `username` (email) no exista ya en `users`. Crea un `User` con
        `role='coach'`. No redirige: re-renderiza la misma página con
        `$success` o `$error`.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [csrf_token, name, email, password]
              properties:
                csrf_token: { $ref: "#/components/schemas/CsrfToken" }
                name: { type: string, example: "Juan Pérez" }
                email: { type: string, format: email, example: "entrenador@ejemplo.com" }
                password: { type: string, format: password, example: "SecurePass1!" }
      responses:
        "200":
          description: Página re-renderizada con mensaje de éxito o error.
          content: { text/html: { schema: { type: string } } }

  /atletas.php:
    get:
      tags: [Atletas]
      summary: Listado de atletas del coach autenticado
      description: Requiere `role=coach`. Usa `User::getByCoachId`.
      parameters:
        - name: success
          in: query
          required: false
          schema: { type: string, enum: ["1"] }
          description: Presente tras crear un atleta exitosamente.
        - name: updated
          in: query
          required: false
          schema: { type: string, enum: ["1"] }
        - name: deleted
          in: query
          required: false
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: Listado de atletas renderizado.
          content: { text/html: { schema: { type: string } } }
    post:
      tags: [Atletas]
      summary: Crear, actualizar o eliminar un atleta (acción por campo `action`)
      description: >
        Requiere `role=coach`. El campo `action` determina la operación:
        `create_athlete` (crea `User(role=athlete, coach_id=coach.id)` con
        defaults `available_days=['lunes'..'viernes']`, `preferred_long_run_day='Domingo'`,
        `max_time_per_session=60`, `level='Principiante'`),
        `update_athlete` (requiere `athlete_id`; solo re-hashea `password` si se
        envía y es distinto de `"********"`), o `delete_athlete` (requiere
        `athlete_id`, borrado físico sin verificar ownership por `coach_id`).
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: "#/components/schemas/CreateAthleteAction"
                - $ref: "#/components/schemas/UpdateAthleteAction"
                - $ref: "#/components/schemas/DeleteAthleteAction"
      responses:
        "302":
          description: "Redirección a atletas.php?success=1 / ?updated=1 / ?deleted=1"
          headers:
            Location: { schema: { type: string, example: "atletas.php?success=1" } }

  /generar_plan.php:
    get:
      tags: [Planes]
      summary: Generador de plan semanal y biblioteca de plantillas
      description: >
        Requiere `role=coach`. Tiene dos pestañas controladas por `?tab=plan|plantillas`
        (default `plan`).
      parameters:
        - name: tab
          in: query
          schema: { type: string, enum: [plan, plantillas], default: plan }
        - name: success
          in: query
          schema: { type: string, enum: [plan, template_created, template_updated, template_deleted] }
      responses:
        "200":
          description: Página del generador de planes o de la biblioteca de plantillas, según `tab`.
          content: { text/html: { schema: { type: string } } }
    post:
      tags: [Planes]
      summary: Generar plan semanal o administrar plantillas (acción por campo `action`)
      description: >
        Requiere `role=coach`. `action=generate_plan`: por cada día (lunes..domingo)
        con `template_<dia>` seleccionado, crea un `Workout` (`status='pending'`,
        `delivery_status='sent'`, `structure` copiado del template) para
        `athlete_id` en la fecha calculada desde `week_start`. Si se creó al
        menos un workout, envía correo (`Mailer::sendNewPlanNotification`) y una
        `Notification` al atleta (solo si el atleta tiene `username`/email válido).
        `action=create_template` / `update_template` / `delete_template`: CRUD
        directo sobre `templates`, acotado por `coach_id`.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: "#/components/schemas/GeneratePlanAction"
                - $ref: "#/components/schemas/CreateTemplateAction"
                - $ref: "#/components/schemas/UpdateTemplateAction"
                - $ref: "#/components/schemas/DeleteTemplateAction"
      responses:
        "302":
          description: "Redirección con mensaje de éxito, p.ej. generar_plan.php?success=plan"
          headers:
            Location: { schema: { type: string, example: "generar_plan.php?success=plan" } }

  /entrenamientos.php:
    get:
      tags: [Entrenamientos]
      summary: Entrenamientos completados y estado de feedback
      description: >
        Requiere `role=coach`. Lista hasta 100 workouts con `status='completed'`
        de los atletas del coach, con estadísticas de entrega
        (total/completados/esperando respuesta/respondidos).
      parameters:
        - name: athlete_id
          in: query
          schema: { type: string, default: all }
        - name: period
          in: query
          schema: { type: string, enum: [all, this_week, last_week, this_month, last_month], default: all }
        - name: success
          in: query
          schema: { type: string, enum: [feedback] }
      responses:
        "200":
          description: Tabla de entrenamientos completados renderizada.
          content: { text/html: { schema: { type: string } } }
    post:
      tags: [Entrenamientos]
      summary: Responder feedback de un entrenamiento completado
      description: >
        Requiere `role=coach`. `action=add_feedback` invoca
        `Workout::addCoachFeedback(workout_id, coach_feedback)` y notifica al
        atleta dueño del workout. **Nota de riesgo**: el modelo no valida que el
        workout pertenezca a un atleta del coach autenticado (posible IDOR).
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [csrf_token, action, workout_id, coach_feedback]
              properties:
                csrf_token: { $ref: "#/components/schemas/CsrfToken" }
                action: { type: string, enum: [add_feedback] }
                workout_id: { type: integer, example: 42 }
                coach_feedback: { type: string, example: "Buen ritmo, sigue así para la próxima semana." }
      responses:
        "302":
          description: Feedback guardado — redirección a entrenamientos.php con los mismos filtros.
          headers:
            Location: { schema: { type: string, example: "entrenamientos.php?success=feedback&athlete_id=all&period=all" } }

  /mis_planes.php:
    get:
      tags: [Planes]
      summary: Historial completo de planes generados (todos los estados)
      description: >
        Requiere `role=coach`. Usa `Workout::getAllByCoach` +
        `Workout::getPlansSummaryByCoach` para listar y resumir todos los
        workouts del coach, con filtros combinables.
      parameters:
        - name: athlete_id
          in: query
          schema: { type: string, default: all }
        - name: status
          in: query
          schema: { type: string, enum: [all, pending, completed], default: all }
        - name: period
          in: query
          schema: { type: string, enum: [all, this_week, last_week, this_month, last_month], default: all }
      responses:
        "200":
          description: Historial de planes renderizado.
          content: { text/html: { schema: { type: string } } }

  /mi_plan.php:
    get:
      tags: [Mi Plan]
      summary: Calendario mensual de entrenamientos del atleta
      description: >
        Requiere `role=athlete`. Muestra el mes indicado (`?month=YYYY-MM`,
        default mes actual) como calendario, con branding del team si existe.
      parameters:
        - name: month
          in: query
          schema: { type: string, pattern: "^\\d{4}-\\d{2}$", example: "2026-08" }
        - name: success
          in: query
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: Calendario mensual renderizado.
          content: { text/html: { schema: { type: string } } }
    post:
      tags: [Mi Plan]
      summary: Registrar resultados de un entrenamiento (completar)
      description: >
        Requiere `role=athlete`. `action=complete_workout` marca el workout como
        `status='completed'`, `delivery_status='received'`,
        `completed_at=NOW()`, guarda resultados y, si se adjunta imagen válida
        (`UPLOAD_ERR_OK`, sin validar tipo/tamaño), la mueve a
        `uploads/evidence/` y guarda su ruta en `evidence_path`. Notifica al
        coach del atleta.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [csrf_token, action, workout_id]
              properties:
                csrf_token: { $ref: "#/components/schemas/CsrfToken" }
                action: { type: string, enum: [complete_workout] }
                workout_id: { type: integer, example: 101 }
                actual_distance: { type: number, format: float, nullable: true, description: "km recorridos.", example: 10.5 }
                actual_time: { type: number, format: float, nullable: true, description: "minutos.", example: 52.3 }
                rpe: { type: integer, minimum: 1, maximum: 10, nullable: true, example: 7 }
                feedback: { type: string, nullable: true, example: "Me sentí bien, ritmo cómodo todo el recorrido." }
                evidence: { type: string, format: binary, description: "Imagen de evidencia (foto/captura), jpg/jpeg/png/webp, máx. 5MB. Validada por extensión, tamaño y tipo MIME real (includes/FileUpload.php)." }
      responses:
        "302":
          description: Entrenamiento registrado — redirección al calendario del mes correspondiente.
          headers:
            Location: { schema: { type: string, example: "mi_plan.php?success=1&month=2026-08" } }

  /mi_progreso.php:
    get:
      tags: [Métricas]
      summary: Progreso y estadísticas personales del atleta
      description: >
        Requiere `role=athlete`. Combina `Workout::getAthleteMetrics`,
        `getProgressionData` (8 semanas), `getAthleteStreak` y
        `getRecentCompletedByAthlete` (últimos 20) para graficar volumen,
        ritmo y RPE con Chart.js.
      responses:
        "200":
          description: Página de progreso personal renderizada.
          content: { text/html: { schema: { type: string } } }

  /metricas.php:
    get:
      tags: [Métricas]
      summary: Métricas de un atleta específico o comparativa de todo el equipo
      description: >
        Requiere `role=coach`. Si `athlete_id` es distinto de `all`, muestra
        métricas individuales (`Workout::getAthleteMetrics` +
        `getProgressionData`); si es `all` (default), muestra tabla comparativa
        (`Workout::getCoachAthletesMetrics`).
      parameters:
        - name: athlete_id
          in: query
          schema: { type: string, default: all }
      responses:
        "200":
          description: Página de métricas renderizada (individual o comparativa).
          content: { text/html: { schema: { type: string } } }

  /notificaciones.php:
    get:
      tags: [Notificaciones]
      summary: Notificaciones no leídas del usuario / marcar como leídas
      description: >
        Disponible para `admin`, `coach` y `athlete`. `?read=<id>` marca una
        notificación puntual como leída y redirige; `?read_all=1` marca todas
        las del usuario y redirige. Sin parámetros, lista las notificaciones no
        leídas (`Notification::getUnread`) — no incluye leídas ni pagina.
      parameters:
        - name: read
          in: query
          schema: { type: integer }
        - name: read_all
          in: query
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: Listado de notificaciones no leídas renderizado.
          content: { text/html: { schema: { type: string } } }
        "302":
          description: Tras `read` o `read_all`, redirige a notificaciones.php.
          headers:
            Location: { schema: { type: string, example: "notificaciones.php" } }
    post:
      tags: [Notificaciones]
      summary: Enviar notificación manual a un atleta o a todo el equipo
      description: >
        Solo tiene efecto si `role=coach` (si no, responde con `$error` sin
        crear nada). `target_id='all'` notifica a todos los atletas del coach
        (`User::getAthletesByCoach`); un id específico notifica solo a ese atleta.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [csrf_token, action, target_id, message]
              properties:
                csrf_token: { $ref: "#/components/schemas/CsrfToken" }
                action: { type: string, enum: [send_notification] }
                target_id: { type: string, description: "'all' o un users.id", example: "all" }
                message: { type: string, example: "Recuerden hidratarse bien antes del fondo del sábado." }
      responses:
        "200":
          description: Página re-renderizada con `$success` o `$error` (sin redirect).
          content: { text/html: { schema: { type: string } } }

  /perfil.php:
    get:
      tags: [Perfil]
      summary: Datos de perfil del usuario autenticado
      description: Requiere sesión activa (cualquier rol).
      responses:
        "200":
          description: Página de perfil renderizada.
          content: { text/html: { schema: { type: string } } }
        "302":
          description: Sin sesión activa — redirección a login.php.
          $ref: "#/components/responses/RedirectLogin"
    post:
      tags: [Perfil]
      summary: Actualizar perfil propio (datos, contraseña, avatar)
      description: >
        Requiere sesión activa. Si `password` viene no vacío, debe coincidir con
        `confirm_password` o se rechaza con error. El avatar solo se reemplaza
        si el upload es válido y su extensión está en
        [jpg, jpeg, png, webp]. **Nota de comportamiento observado**: tras
        guardar, el código escribe `$_SESSION['user_name']`, pero
        `Auth::user()` lee `$_SESSION['name']` — el nombre actualizado no se
        refleja en la sesión activa hasta el siguiente login.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [csrf_token, name, email, password, confirm_password]
              properties:
                csrf_token: { $ref: "#/components/schemas/CsrfToken" }
                name: { type: string, example: "Juan Pérez" }
                email: { type: string, format: email, example: "juan@ejemplo.com" }
                password: { type: string, format: password, description: "Vacío para mantener la contraseña actual.", example: "" }
                confirm_password: { type: string, format: password, example: "" }
                avatar: { type: string, format: binary, description: "jpg/jpeg/png/webp, máx. 5MB. Validado por extensión, tamaño y tipo MIME real (includes/FileUpload.php)." }
      responses:
        "200":
          description: Página re-renderizada con `$success` o `$error` (sin redirect).
          content: { text/html: { schema: { type: string } } }

  /config_team.php:
    get:
      tags: [Team]
      summary: Formulario de configuración del team del coach
      description: Requiere `role=coach`.
      responses:
        "200":
          description: Formulario de configuración del team renderizado.
          content: { text/html: { schema: { type: string } } }
    post:
      tags: [Team]
      summary: Crear o actualizar el team del coach (relación 1:1)
      description: >
        Requiere `role=coach`. Si el coach ya tiene un `Team` (`Team::findByCoach`),
        lo actualiza (`Team::update`); si no, lo crea (`Team::create`). El logo
        solo se reemplaza si la extensión está en [jpg, jpeg, png, webp]; en
        caso contrario se conserva `logo_url` previo y se responde con error.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [csrf_token, name]
              properties:
                csrf_token: { $ref: "#/components/schemas/CsrfToken" }
                name: { type: string, example: "RunFast Team" }
                primary_color: { type: string, format: color, default: "#3b82f6", example: "#3b82f6" }
                logo: { type: string, format: binary, description: "jpg/jpeg/png/webp, máx. 5MB. Validado por extensión, tamaño y tipo MIME real (includes/FileUpload.php)." }
      responses:
        "200":
          description: Página re-renderizada con `$success` o `$error` (sin redirect).
          content: { text/html: { schema: { type: string } } }

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: PHPSESSID
      description: >
        Sesión nativa de PHP (`session_start`, iniciada por `Auth::init`). No
        hay tokens, API keys ni expiración explícita más allá de la sesión de
        PHP. El estado de autorización se guarda en
        `$_SESSION['user_id'|'role'|'name']`. Rutas protegidas por rol usan
        `Auth::requireRole($role)` (coincidencia exacta, no jerárquica) o
        `Auth::requireRoleLike($roles)`.

  responses:
    RedirectLogin:
      description: Sin sesión activa — redirección a login.php.
      headers:
        Location: { schema: { type: string, example: "login.php" } }
    RedirectDashboard:
      description: Redirección a dashboard.php.
      headers:
        Location: { schema: { type: string, example: "dashboard.php" } }
    RedirectByRole:
      description: >
        Redirección según rol: admin -> admin_dashboard.php,
        athlete -> mi_plan.php, sin sesión -> login.php.
      headers:
        Location: { schema: { type: string, example: "admin_dashboard.php" } }

  schemas:
    CsrfToken:
      type: string
      description: >
        Token CSRF de la sesión activa (`Csrf::token()`), entregado en un
        campo oculto `csrf_token` en cada formulario renderizado por el
        servidor (o en una constante `CSRF_TOKEN` para formularios generados
        por JavaScript). Si falta o no coincide con el de la sesión, la
        petición se rechaza sin aplicar ningún cambio (capacidad `security`,
        change `add-csrf-protection`).
      example: "3f2a9c1b7e4d6f0a8c5b2e9d1f4a7c0b3e6d9f2a5c8b1e4d7f0a3c6b9e2d5f8a"

    Role:
      type: string
      enum: [admin, coach, athlete]
      description: Rol único por usuario. No es jerárquico.

    AthleteLevel:
      type: string
      enum: [Principiante, Intermedio, Avanzado]
      default: Principiante

    WorkoutType:
      type: string
      enum: [Series, Intervalos, Fondo, Tempo, Recuperación, Descanso]
      description: Compartido entre `templates.type` y `workouts.type`.

    BlockType:
      type: [string, "null"]
      enum: [Base, Construcción, Pico, null]
      description: Fase del bloque de entrenamiento al que pertenece la plantilla.

    WorkoutStatus:
      type: string
      enum: [pending, completed]

    DeliveryStatus:
      type: string
      enum: [pending, sent, received]
      description: >
        Ciclo observado en el código: 'pending' (default en creación directa),
        'sent' (al generar un plan vía generar_plan.php), 'received' (al
        completar el entrenamiento vía mi_plan.php). No existe un estado que
        indique "visto sin completar": la columna `viewed_at` que lo
        representaría solo la actualizaba `Workout::markAsReceived`, un método
        sin ningún caller en el código actual.

    User:
      type: object
      description: Entidad `users`. Representa admins, coaches y atletas en una sola tabla.
      properties:
        id: { type: integer, readOnly: true, example: 12 }
        username: { type: string, description: "Login único; en la práctica siempre es un email.", example: "atleta1@runcoach.com" }
        role: { $ref: "#/components/schemas/Role" }
        name: { type: string, example: "María Torres" }
        email: { type: [string, "null"], format: email }
        avatar_url: { type: [string, "null"], example: "uploads/avatars/avatar_12_1699999999.png" }
        coach_id: { type: [integer, "null"], description: "Solo poblado cuando role=athlete; referencia al coach que lo creó.", example: 3 }
        team_id: { type: [integer, "null"], description: "Columna aceptada por User::create pero no poblada por ningún flujo actual (la relación real coach↔team se resuelve vía teams.coach_id)." }
        goal_date: { type: [string, "null"], format: date }
        goal_pace: { type: [string, "null"], description: "Texto libre, formato min:seg por km.", example: "5:30" }
        level: { $ref: "#/components/schemas/AthleteLevel" }
        available_days:
          type: [array, "null"]
          items: { type: string }
          description: "Se guarda como JSON al crear el atleta con un valor fijo (lunes-viernes); ningún flujo actual lo vuelve a leer."
          example: ["lunes", "martes", "miercoles", "jueves", "viernes"]
        preferred_long_run_day: { type: [string, "null"], example: "Domingo" }
        max_time_per_session: { type: [integer, "null"], description: "Minutos.", example: 90 }
        observations: { type: [string, "null"] }
        created_at: { type: string, format: date-time, readOnly: true }

    CreateAthleteAction:
      type: object
      required: [csrf_token, action, name, email, password]
      properties:
        csrf_token: { $ref: "#/components/schemas/CsrfToken" }
        action: { type: string, enum: [create_athlete] }
        name: { type: string, example: "Pedro Ramírez" }
        email: { type: string, format: email, description: "Se guarda como users.username.", example: "pedro@ejemplo.com" }
        password: { type: string, format: password }
        goal_date: { type: string, format: date, nullable: true }
        goal_pace: { type: string, nullable: true, example: "5:30" }
        level: { $ref: "#/components/schemas/AthleteLevel" }
        preferred_long_run_day: { type: string, default: Domingo }
        max_time_per_session: { type: integer, default: 60 }
        observations: { type: string, nullable: true }

    UpdateAthleteAction:
      type: object
      required: [csrf_token, action, athlete_id, name, email]
      properties:
        csrf_token: { $ref: "#/components/schemas/CsrfToken" }
        action: { type: string, enum: [update_athlete] }
        athlete_id: { type: integer, example: 12 }
        name: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password, description: "Vacío o '********' para conservar la contraseña actual." }
        goal_date: { type: string, format: date, nullable: true }
        goal_pace: { type: string, nullable: true }
        level: { $ref: "#/components/schemas/AthleteLevel" }
        preferred_long_run_day: { type: string }
        max_time_per_session: { type: integer }
        observations: { type: string, nullable: true }

    DeleteAthleteAction:
      type: object
      required: [csrf_token, action, athlete_id]
      properties:
        csrf_token: { $ref: "#/components/schemas/CsrfToken" }
        action: { type: string, enum: [delete_athlete] }
        athlete_id: { type: integer, example: 12 }

    Team:
      type: object
      description: "Entidad `teams`. Relación 1:1 de facto con un coach (Team::findByCoach usa fetch())."
      properties:
        id: { type: integer, readOnly: true }
        coach_id: { type: integer }
        name: { type: string, example: "RunFast Team" }
        logo_url: { type: [string, "null"], example: "uploads/teams/team_3_1699999999.png" }
        primary_color: { type: string, default: "#3b82f6", example: "#3b82f6" }
        created_at: { type: string, format: date-time, readOnly: true }

    Notification:
      type: object
      description: Entidad `notifications`.
      properties:
        id: { type: integer, readOnly: true }
        user_id: { type: integer, description: "Destinatario." }
        message: { type: string, example: "📋 Tu entrenador ha generado un nuevo plan de entrenamiento para la semana del 25/08/2026" }
        is_read: { type: boolean, default: false }
        type: { type: string, default: info, description: "En la práctica siempre 'info'; no se observan otros valores emitidos por el código." }
        created_at: { type: string, format: date-time, readOnly: true }

    Template:
      type: object
      description: Entidad `templates`. Biblioteca reutilizable de sesiones de entrenamiento por coach.
      properties:
        id: { type: integer, readOnly: true }
        coach_id: { type: integer }
        name: { type: string, example: "10x400m @1:35" }
        type: { $ref: "#/components/schemas/WorkoutType" }
        block_type: { $ref: "#/components/schemas/BlockType" }
        structure: { type: string, description: "Texto libre descriptivo (no JSON).", example: "Ritmo 3k, rec 75s" }

    CreateTemplateAction:
      type: object
      required: [csrf_token, action, name, type]
      properties:
        csrf_token: { $ref: "#/components/schemas/CsrfToken" }
        action: { type: string, enum: [create_template] }
        name: { type: string }
        type: { $ref: "#/components/schemas/WorkoutType" }
        block_type: { $ref: "#/components/schemas/BlockType" }
        structure: { type: string, nullable: true }

    UpdateTemplateAction:
      type: object
      required: [csrf_token, action, template_id, name, type]
      properties:
        csrf_token: { $ref: "#/components/schemas/CsrfToken" }
        action: { type: string, enum: [update_template] }
        template_id: { type: integer }
        name: { type: string }
        type: { $ref: "#/components/schemas/WorkoutType" }
        block_type: { $ref: "#/components/schemas/BlockType" }
        structure: { type: string, nullable: true }

    DeleteTemplateAction:
      type: object
      required: [csrf_token, action, template_id]
      properties:
        csrf_token: { $ref: "#/components/schemas/CsrfToken" }
        action: { type: string, enum: [delete_template] }
        template_id: { type: integer }

    GeneratePlanAction:
      type: object
      required: [csrf_token, action, athlete_id, week_start]
      description: >
        Los campos `template_lunes`...`template_domingo` son opcionales e
        independientes: solo los días con un template_id seleccionado generan
        un Workout.
      properties:
        csrf_token: { $ref: "#/components/schemas/CsrfToken" }
        action: { type: string, enum: [generate_plan] }
        athlete_id: { type: integer, example: 12 }
        week_start: { type: string, format: date, description: "Lunes de la semana a planificar.", example: "2026-08-31" }
        template_lunes: { type: integer, nullable: true }
        template_martes: { type: integer, nullable: true }
        template_miercoles: { type: integer, nullable: true }
        template_jueves: { type: integer, nullable: true }
        template_viernes: { type: integer, nullable: true }
        template_sabado: { type: integer, nullable: true }
        template_domingo: { type: integer, nullable: true }

    Workout:
      type: object
      description: >
        Entidad `workouts`, el núcleo del sistema: una sesión de entrenamiento
        planificada por el coach y/o registrada por el atleta.
      properties:
        id: { type: integer, readOnly: true }
        athlete_id: { type: integer }
        date: { type: string, format: date-time }
        type: { $ref: "#/components/schemas/WorkoutType" }
        description: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/WorkoutStatus" }
        planned_distance: { type: [integer, "null"], description: "km planificados." }
        planned_time: { type: [integer, "null"], description: "minutos planificados." }
        actual_distance:
          type: [number, "null"]
          description: "km reales reportados por el atleta (DECIMAL(6,2))."
          example: 10.5
        actual_time:
          type: [number, "null"]
          description: "minutos reales reportados por el atleta (DECIMAL(6,2))."
          example: 52.3
        rpe: { type: [integer, "null"], minimum: 1, maximum: 10, description: "Esfuerzo percibido, autorreportado por el atleta." }
        feedback: { type: [string, "null"], description: "Feedback del atleta sobre la sesión." }
        coach_feedback: { type: [string, "null"], description: "Respuesta del coach al feedback del atleta." }
        coach_feedback_at: { type: [string, "null"], format: date-time }
        structure:
          description: "JSON copiado del template.structure al generar el plan; se decodifica a objeto/array en lectura. Puede ser texto libre en workouts creados fuera del flujo de plantillas."
          oneOf:
            - type: object
            - type: string
            - type: "null"
        delivery_status: { $ref: "#/components/schemas/DeliveryStatus" }
        evidence_path:
          type: [string, "null"]
          description: >
            Ruta de la imagen de evidencia subida al completar el entrenamiento.
            Definida en scripts/setup.php y scripts/migrate_workout_columns.php
            (change align-workout-schema); reemplaza a la columna evidence_url,
            que ningún código llegó a usar.
          example: "uploads/evidence/evidence_101_1699999999.jpg"
        completed_at: { type: [string, "null"], format: date-time }

  examples:
    LoginRequestExample:
      value:
        username: coach@runcoach.com
        password: coach123
    WorkoutExample:
      value:
        id: 101
        athlete_id: 12
        date: "2026-08-31T00:00:00"
        type: Series
        description: "10x400m @1:35"
        status: completed
        planned_distance: null
        planned_time: null
        actual_distance: 8.2
        actual_time: 45.5
        rpe: 7
        feedback: "Me sentí bien, terminé fuerte."
        coach_feedback: "Excelente ritmo, seguimos así."
        coach_feedback_at: "2026-09-01T10:15:00"
        structure: "Ritmo 3k, rec 75s"
        delivery_status: received
        evidence_path: "uploads/evidence/evidence_101_1699999999.jpg"
        completed_at: "2026-08-31T19:20:00"
